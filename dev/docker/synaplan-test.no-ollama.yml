# CI-only override stacked on top of synaplan's docker-compose.test.yml +
# docker-compose.test.ci.yml. Moves the upstream ollama_test service out
# of the `integration` profile (which CI activates to get Tika) and into
# a never-activated `disabled` profile, so ollama/ollama:latest (~3.7 GB)
# is never pulled during E2E runs.
#
# Uses the `!override` YAML tag (Compose 2.24+) so the profiles list is
# REPLACED rather than extended — a plain `profiles: [disabled]` entry
# would be appended to the base list, leaving `integration` on the
# service and defeating the point.
#
# E2E only uses Synaplan's test AI provider (AI_DEFAULT_PROVIDER=test),
# so the translate flow never touches Ollama. Tika still comes up
# normally because it stays on the `integration` profile.

services:
  ollama_test:
    profiles: !override
      - disabled
