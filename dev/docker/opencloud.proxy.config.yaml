additional_policies:
  - name: default
    routes:
      # Must come before /api/synaplan — prefix routes are first-match-wins.
      # Synaplan calls this address with no OpenCloud session. The handler
      # checks the signature before it does anything else.
      - endpoint: /api/synaplan/inbound
        backend: http://synaplan-backend:9106
        unprotected: true
      - endpoint: /api/synaplan/assets
        backend: http://synaplan-backend:9106
        unprotected: true
      - endpoint: /api/synaplan
        backend: http://synaplan-backend:9106
