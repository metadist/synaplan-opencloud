<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Synaplan</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search)
      const answer = {
        type: 'synaplan-connect',
        code: params.get('code'),
        state: params.get('state'),
        error: params.get('error')
      }
      if (window.parent !== window) {
        window.parent.postMessage(answer, location.origin)
      } else {
        sessionStorage.setItem('synaplan-connect-answer', JSON.stringify(answer))
        location.replace(sessionStorage.getItem('synaplan-connect-return') || '/')
      }
    </script>
  </body>
</html>
